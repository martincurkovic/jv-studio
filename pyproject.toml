[project]
name = "jv-studio"
version = "0.1.0"
description = "A free, open-source editor and librarian for the Roland JV-1010 sound module. Built with PySide6 (Qt) and python-rtmidi."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Martin Curkovic", email = "martincurkovic@icloud.com" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.12.0",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
jv-studio = "jv_studio.main:main"

[dependency-groups]
dev = ["pytest>=9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jv_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
