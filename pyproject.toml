[project]
name = "jv-studio"
version = "0.1.0"
description = "A free, open-source editor and librarian for the Roland JV-1010 sound module. Built with PySide6 (Qt) and python-rtmidi."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Martin Curkovic", email = "martincurkovic@icloud.com" }]
requires-python = ">=3.12"
dependencies = [
    # Qt 6.12 is the current LTS line. -Essentials has Widgets, Gui and Svg (everything the app uses); the full "PySide6" meta-package would also pull in
    # WebEngine and friends, hundreds of MB the standalone builds don't need.
    "PySide6-Essentials>=6.12,<6.13",
    "python-rtmidi>=1.5.8",
    # the update check's CA bundle: a standalone (Nuitka) build has no system CA store, so https to GitHub fails without it
    "certifi>=2026.7.22",
]

[project.scripts]
jv-studio = "jv_studio.main:main"

[dependency-groups]
dev = ["pytest>=9"]
# Only needed to make the standalone apps (scripts/build_*): Nuitka does the compiling, and imageio lets it turn the PNG icon into a Windows .ico. Same Nuitka pin as AKAISDS.
# PySide6-Addons: Nuitka's PySide6 plugin refuses to run without it, even though the app only uses Essentials modules (the standalone build still bundles just the Qt modules it imports).
build = ["Nuitka==4.1.3", "imageio>=2.37.4", "PySide6-Addons>=6.12,<6.13"]

[tool.uv]
# plain `uv sync` (which the build scripts run) installs both groups; CI's test job passes --no-group build
default-groups = ["dev", "build"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jv_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
